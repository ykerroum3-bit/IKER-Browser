
name: Build IKER Browser

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Node.js sur GitHub
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Créer le Setup.exe
        run: npm run dist

      - name: Récupérer le Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: IKER-Setup
          path: dist/*.exe
